name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch replaces an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here uses a secret. The database is a throwaway service container and
# the Supabase values are placeholders, because nothing below talks to a real
# project. The browser suite is not here: it needs a real Supabase Auth
# project to sign staff in, so it runs locally with `pnpm test:e2e`.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  static:
    name: Types, lint, formatting and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Route and layout prop types are generated, not committed, so they
      # have to exist before tsc reads the app directory.
      - name: Generate route types
        run: pnpm exec next typegen

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ndcak_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ndcak_ci

      # The suite truncates tables between tests and refuses any host that is
      # not local, so it can never reach a hosted project.
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ndcak_ci

  build:
    name: Production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ndcak_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Public pages are prerendered from the database, so the schema has to
      # exist before the build reads it.
      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ndcak_ci

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ndcak_ci
